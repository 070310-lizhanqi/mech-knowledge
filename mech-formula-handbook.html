<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机械设计公式速查手册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b6bcb'/%3E%3Ctext x='16' y='23' font-size='20' font-family='serif' text-anchor='middle' fill='white'%3E%CF%83%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f24; --ink2:#5a6472; --line:#e3e7ec;
  --acc:#0b6bcb; --acc-soft:#e8f1fb; --warn:#a8670a; --warn-soft:#fdf3e2;
  --tbd:#8a4b00; --tbd-soft:#fff2dd; --ok:#0f7b52; --code:#eef1f5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#12161b; --panel:#181d24; --ink:#e6ebf0; --ink2:#98a4b2; --line:#2a323c;
  --acc:#5aa9f8; --acc-soft:#16283c; --warn:#e0a44a; --warn-soft:#2e2413;
  --tbd:#e9b169; --tbd-soft:#2e2413; --ok:#4cc38a; --code:#1e242c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
a{color:var(--acc)}
.wrap{max-width:1280px;margin:0 auto;padding:0 14px 60px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -14px 12px;
}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-weight:500;color:var(--ink2);font-size:12px;margin-left:6px}
.stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
.iconbtn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;line-height:1.3;white-space:nowrap;
}
.iconbtn:hover{border-color:var(--acc);color:var(--acc)}
#menuBtn{display:none}

/* ---------- 工具条 ---------- */
.toolbar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px;margin-bottom:14px;box-shadow:var(--shadow);position:sticky;top:52px;z-index:30;
}
#q{
  flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit;
}
#q:focus{outline:2px solid var(--acc);outline-offset:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- 布局 ---------- */
.layout{display:grid;grid-template-columns:262px minmax(0,1fr);gap:16px;align-items:start}
#toc{
  position:sticky;top:104px;max-height:calc(100vh - 120px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:var(--shadow);
}
#toc a{display:block;color:var(--ink2);text-decoration:none;border-radius:6px;padding:3px 7px;font-size:13px;line-height:1.45}
#toc a:hover{background:var(--acc-soft);color:var(--acc)}
#toc a.lv1{font-weight:700;color:var(--ink);margin-top:6px;font-size:13.5px}
#toc a.lv2{padding-left:14px}
#toc a.lv3{padding-left:26px;font-size:12.5px;font-variant-numeric:tabular-nums}
#toc a.cur{background:var(--acc);color:#fff}
#toc .cnt{color:var(--ink2);font-size:11px;font-weight:400}
#toc a.cur .cnt{color:#fff}
main{min-width:0}

/* ---------- 篇 / 节 ---------- */
.part{margin-bottom:26px}
.part-h{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-left:4px solid var(--acc);padding:6px 0 6px 12px;margin:0 0 10px;
}
.part-h h2{margin:0;font-size:20px}
.part-h .src{color:var(--ink2);font-size:12.5px}
.sec{margin:0 0 18px}
.sec-h{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:16px;font-weight:700;margin:0 0 10px;padding-bottom:5px;border-bottom:1px dashed var(--line);
}
.sec-h .n{color:var(--acc);font-variant-numeric:tabular-nums}
.sec-h .c{font-weight:500;color:var(--ink2);font-size:12.5px}

/* ---------- 公式卡 ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;
}
.card.hide{display:none}
.card-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.fid{
  font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--acc);
  background:var(--acc-soft);border-radius:5px;padding:1px 6px;white-space:nowrap;
}
.fname{font-weight:650;font-size:15px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.badge{font-size:11px;border-radius:5px;padding:1px 6px;white-space:nowrap}
.b-tbd{background:var(--tbd-soft);color:var(--tbd)}
.b-typo{background:var(--warn-soft);color:var(--warn)}
.b-diff{background:var(--acc-soft);color:var(--acc)}
.b-src{background:var(--code);color:var(--ink2);font-weight:500}
.desc{color:var(--ink2);font-size:13px;margin:3px 0 6px}
.desc p{margin:2px 0}

/* 公式显示 */
.fx{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:12px 10px;margin:6px 0;overflow-x:auto;text-align:center;
}
.fx .math{font-size:1.12em}
.fx .math + .math{margin-left:.7em}
.fx + .fx{margin-top:-6px}

/* 表格 */
.tw{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:650;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
.tw table{min-width:min(100%,420px)}

/* 列表 / 条件 / 注 */
.conds{margin:6px 0 0;padding:0;list-style:none}
.conds li{position:relative;padding-left:16px;font-size:13px;margin:2px 0}
.conds li:before{content:"›";position:absolute;left:3px;color:var(--acc);font-weight:700}
.kv{margin:6px 0 0;padding:0;list-style:none;font-size:13px}
.kv li{margin:2px 0;padding-left:14px;position:relative}
.kv li:before{content:"·";position:absolute;left:2px;color:var(--ink2)}
.kv b{color:var(--ink)}
.note{
  margin:7px 0 0;padding:7px 10px;border-left:3px solid var(--warn);
  background:var(--warn-soft);border-radius:0 6px 6px 0;font-size:12.5px;color:var(--ink);
}
.note .lb{font-weight:700;color:var(--warn);margin-right:4px}
.plain{margin:6px 0 0;font-size:13.5px}
.plain p{margin:3px 0}

/* 差异面板 */
.diffs{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:22px;box-shadow:var(--shadow)}
.diffs h2{margin:0 0 4px;font-size:18px}
.diffs .hint{color:var(--ink2);font-size:12.5px;margin:0 0 10px}
.dg{margin:12px 0 0}
.dg h3{font-size:14px;margin:0 0 6px;color:var(--acc)}

/* 页脚 */
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink2);font-size:12.5px}
footer h3{font-size:14px;color:var(--ink);margin:0 0 6px}
footer ol{margin:4px 0 0;padding-left:22px}
footer li{margin:2px 0}
.empty{padding:30px;text-align:center;color:var(--ink2)}

/* ---------- 数学渲染 ---------- */
.math{white-space:nowrap;font-family:"Cambria Math","Latin Modern Math",Cambria,Georgia,"Times New Roman",serif}
.ms{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15}
.ms>span{display:block}
.msub{font-size:.72em}
.msup{font-size:.72em}
.mfrac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 .18em}
.mfrac .mnum{border-bottom:1.1px solid currentColor;padding:0 .3em}
.mfrac .mden{padding:0 .3em}
.msqrt{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .1em}
.msqrt .mradic{border-top:1.1px solid currentColor;padding:0 .25em;margin-top:.12em}
.msqrt .mroot{font-size:.7em;transform:translateY(.18em);padding-right:.08em}
.mover{display:inline-block;border-top:1.1px solid currentColor;padding-top:.05em}
.mtext{font-family:inherit}
.mf{font-family:inherit;padding-right:.06em}
.mg{}
.mtable{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.35}
.mtable .mrow{display:flex}
.mtable .mtd{flex:1 1 0;padding:0 .45em;text-align:center}
.mcases{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:left;line-height:1.5}
.mcases .mrow{display:flex;align-items:center}
.mcases .mbrace{font-size:1.5em;line-height:1;padding-right:.15em;color:var(--ink2)}
.mcases .mbody{display:flex;flex-direction:column}
.mbig{font-size:1.35em;line-height:1;display:inline-block;vertical-align:middle;padding:0 .08em}
.msp{display:inline-block;width:.5em}
.msp-wide{width:1.4em}
.mo{font-style:normal}
.munk{color:#c0392b;font-family:var(--mono);font-size:.9em}
.tbd{background:var(--tbd-soft);color:var(--tbd);border-radius:4px;padding:0 3px;font-size:.92em;white-space:nowrap}
code.cm{font-family:inherit;background:none;padding:0;color:inherit;font-size:1em}
code.cd{font-family:var(--mono);font-size:.88em;background:var(--code);border-radius:4px;padding:1px 4px}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  #menuBtn{display:inline-block}
  .layout{grid-template-columns:1fr}
  #toc{
    position:fixed;left:0;top:0;bottom:0;width:78%;max-width:300px;max-height:none;
    border-radius:0;z-index:60;transform:translateX(-102%);transition:transform .22s ease;
    padding-top:14px;
  }
  #toc.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .stats .stat:nth-child(n+4){display:none}
  .toolbar{top:52px}
}
@media (max-width:560px){
  .wrap{padding:0 10px 50px}
  .topbar{margin:0 -10px 10px;padding:8px 10px}
  .brand{font-size:14.5px}
  .brand small{display:none}
  .card{padding:10px 11px}
  .fx{padding:10px 6px}
  .fx .math{font-size:1.05em}
  .fname{font-size:14px}
}
@media print{
  .topbar,.toolbar,#toc,#menuBtn{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .layout{display:block}
  .card,.diffs{box-shadow:none;border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid}
  .sec-h,.part-h{break-after:avoid}
  .fx{background:#fff}
  a{color:#000;text-decoration:none}
}

/* ---------- 卡片计算器 ---------- */
.calc{border:1px dashed var(--acc);border-radius:8px;background:var(--acc-soft);padding:8px 10px;margin-top:8px;font-size:13px}
.calc .ct{font-weight:600;color:var(--acc);margin-bottom:6px}
.calc .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.calc label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:var(--ink2)}
.calc input{width:90px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;background:var(--panel);color:var(--ink)}
.calc button{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer}
.calc button:hover{filter:brightness(1.1)}
.calc .res{margin-top:4px;font-family:var(--mono);color:var(--ink);background:var(--panel);border-radius:6px;padding:6px 8px;display:none;white-space:pre-wrap}
.calc .res.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="iconbtn" id="menuBtn" aria-label="目录">☰</button>
    <div class="brand">机械设计公式速查手册<small>濮良贵《机械设计》第9版 · 公式逐字照录 · 多源交叉核对</small></div>
    <div class="stats" id="stats"></div>
    <button class="iconbtn" id="themeBtn" title="切换深浅色">◐</button>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜索公式编号（如 F3-63）、名称、符号（如 σ_H、d_1）…" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="acts">
      <button class="iconbtn" id="diffBtn" aria-pressed="false">仅看差异/存疑</button>
      <button class="iconbtn" id="openAllBtn">全部展开</button>
      <button class="iconbtn" id="printBtn">打印 / 存 PDF</button>
    </div>
  </div>

  <div class="layout">
    <aside id="toc" aria-label="目录"></aside>
    <main id="content"></main>
  </div>
</div>

2 \\sim 3)$","教材ch07"],["微观尖峰擦平深度","$S_i = 1.6 Ra_i$（$i = 1,2$）","教材ch07"],["装配最小间隙 $\\Delta_0$","取同公称直径间隙配合 $H7/g6$ 的最小间隙，或查手册","教材ch07"],["结构胶黏剂常温抗剪强度","一般不低于 8 MPa","教材ch07"],["胶接减重效果","比铆接、焊接和螺纹连接等一般可轻 20% 左右","教材ch07"],["配合面摩擦因数 $f$","与配合面状态、材料及润滑情况等有关，应由试验测定，参考值查表（原文未给数值）","教材ch07"],["接合面摩擦因数 $f$（受转矩螺栓组）","查表（原文未给数值）","教材ch05"],["键 / 花键许用挤压应力 $[\\sigma_{bs}]$、许用压力 $[p]$、螺栓 $[\\tau]$、$[\\sigma_p]$ 等","查机械设计手册表（来源网页未给具体数值）","教材ch05/ch06/ch07、习题课"]]}],"l":[]}},{"id":"2.6.2","t":"螺纹连接件精度等级（GB/T 3103，照录原文）","body":{"f":[],"d":[],"n":[],"c":[],"s":[],"t":[{"head":["精度等级","适用范围"],"rows":[["A 级","要求配合精确、防止振动等重要零件的连接"],["B 级","受载较大且经常装拆、调整或承受变载荷的连接"],["C 级","一般的螺纹连接（常用）"]]}],"l":[]}},{"id":"2.6.3","t":"受力分析基本假设与设计要点（无公式，照录原文）","body":{"f":[],"d":[],"n":[],"c":[],"s":[],"t":[],"l":[{"k":"","v":"**螺栓组受力分析基本假设**（教材ch05）：各螺栓的拉伸/剪切刚度与预紧力均相同；螺栓应变在弹性范围内；螺栓组对称中心与接合面形心重合；受载后接合面仍保持平面。"},{"k":"","v":"**螺栓组结构设计要点**（教材ch05）：接合面形状设计成轴对称简单几何形状（圆形、环形、矩形、框形、三角形等）；螺栓布置使各螺栓受力合理；排列应有合理间距、边距；同一圆周上的螺栓数目取 4、6、8 等偶数，同一螺栓组中螺栓的材料、直径、长度均应相同；避免螺栓承受附加弯曲载荷。"},{"k":"","v":"**受拉螺栓失效与设计准则**（教材ch05）：受拉螺栓——螺栓杆螺纹部分发生断裂，保证螺栓的静力或疲劳拉伸强度；受剪螺栓——螺栓杆和孔壁贴合面压溃或螺栓杆被剪断，保证连接的挤压强度（决定性作用）和螺栓的剪切强度。"},{"k":"","v":"**提高螺纹连接强度措施**（教材ch05）：降低应力幅、改善螺纹牙载荷分布、减小应力集中、合理制造工艺（冷镦螺栓头部、滚压螺纹、氮化、氰化、喷丸等）。"},{"k":"","v":"**键连接失效分析**（习题课）：键侧面受挤压、截面 a-a 受剪切；可能失效为较弱零件（通常轮毂）工作面压溃（静联接）或磨损（动联接）和键的剪断。对实际材料和标准尺寸，压溃/磨损是主要失效，故通常只做挤压应力（静联接）或压强（动联接）校核。"},{"k":"","v":"**花键特点**（教材ch06）：受力均匀、齿根应力集中较小、对轴与毂强度削弱少、齿数多总接触面积大可承受较大载荷、对中性与导向性好。矩形花键小径定心，定心精度高、稳定性好，能用磨削消除热处理变形；渐开线花键齿形定心，齿受载时齿上径向力能起自动定心作用，有利于各齿均匀承载。"},{"k":"","v":"**型面连接要点**（教材ch06）：把安装轮毂的那段轴做成非圆形截面的柱体或锥体，轮毂上制相应孔；优点为对中性好、可传递较大扭矩；常用型面曲线为摆线、等距曲线，其他截面形状有方形、正六边形、带切口的圆形；相关标准 GB/T 28701-2012 胀紧联结套。"},{"k":"","v":"**胶接接头设计要点**（教材ch07）：胶缝的抗剪切及抗拉伸性能强，抗扯离及抗剥离能力弱；应尽可能使胶缝承受剪切或拉伸载荷，避免承受扯离、剥离；采取防剥离措施（加装紧固装置、边缘卷边、加大胶接面积，防止从边缘或拐角处脱缝）；减小胶缝处应力集中（板材端部切成斜角，或使胶黏剂与胶接件材料的膨胀系数接近）；有较大冲击、振动时，在胶接面间增加玻璃布层等缓冲减振材料。"},{"k":"","v":"**铆缝破坏形式**（教材ch07，无公式）：铆钉被剪断、板边被剪坏、钉孔接触面被压坏、板沿钉孔被拉断、板边被撕裂。"}]}}]}]},{"id":"p3","title":"三、机械传动", :"维基核对：中文维基百科「带 (机械)」（rev 95077185）给出等价写法 $\\frac{T_1}{T_2} = e^{\\mu\\alpha}$（$T_1$ 紧边张紧力、$T_2$ 松边张紧力、$\\mu$ 摩擦系数、$\\alpha$ 小带轮包角），与教材一致；维基仅给出此式。"}]}},{"id":"F3-07","t":"小带轮包角","body":{"f":["\\alpha_1 \\approx 180^{\\circ} - (d_{d2} - d_{d1})\\frac{57.3^{\\circ}}{a}"],"d":[],"n":[],"c":["对 V 带轮来说，基准直径就是带轮槽宽尺寸等于带的节宽 $b_p$ 处的直径。"],"s":["来源: 教材ch08"],"t":[{"head":["符号","含义","单位"],"rows":[["$\\alpha_1$","小带轮包角","°"],["$d_{d2}$","大带轮基准直径","mm"],["$d_{d1}$","小带轮基准直径","mm"],["$a$","带轮中心距","mm"]]}],"l":[]}},{"id":"F3-08","t":"大带轮包角","body":{"f":["\\alpha_2 \\approx 180^{\\circ} + (d_{d2} - d_{d1})\\frac{57.3^{\\circ}}{a}"],"d":[],"n":[],"c":["原文未给适用条件"],"s":["来源: 教材ch08"],"t":[{"head":["符号","含义","单位"],"rows":[["$\\alpha_2$","大带轮包角","°"],["$d_{d2}$","大带轮基准直径","mm"],["$d_{d1}$","小带轮基准直径","mm"],["$a$","带轮中心距","mm"]]}],"l":[]}},{"id":"F3-09","t":"最大有效拉力（临界值）","body":{"f":["F_{ec} = 2 F_0 \\frac{e^{f_v \\alpha} - 1}{e^{f_v \\alpha} + 1}"],"d":[],"n":[],"c":[],"s":["来源: 教材ch08"],"t":[{"head":["符号","含义","单位"],"rows":[["$F_{ec}$","最大有效拉力","N"],["$F_0$","初拉力","N"],["$e$","自然对数的底数（原文未给单位）","—"],["$f_v$","当量摩擦因数（原文未给单位）","—"],["$\\alpha$","带在带轮上的包角","rad"]]}],"l":[{"k":"适用条件与限制","v":"式中的包角 $\\alpha$ 应取 $\\alpha_1$ 和 $\\alpha_2$ 中的较小者。"},{"k":"","v":"影响因素："},{"k":"","v":"初拉力 $F_0$：$F_{ec}$ 与 $F_0$ 成正比；$F_0$ 过大时带磨损加剧、过快松弛、寿命缩短；$F_0$ 过小时带的工作能力得不到充分发挥，运转时容易发生跳动和打滑。"},{"k":"","v":"包角 $\\alpha$：$F_{ec}$ 随包角 $\\alpha$ 的增大而增大。"},{"k":"","v":"当量摩擦因数 $f_v$：$F_{ec}$ 随摩擦因数 $f$ 的增大而增大；$f_v$ 与带及带轮的材料和表面状况、工作环境有关。"}]}},{"id":"F3-10","t":"紧边拉应力","body":{"f":["\\sigma_1 = \\frac{F_1}{A}"],"d":[],"n":[],"c":["原文未给适用条件"],"s":["来源: 教材ch08"],"t":[{"head":["符号","含义","单位"],"rows":[["$\\sigma_1$","紧边拉应力","MPa"],["$F_1$","紧边拉力","N"],["$A$","传动带的横截面积","mm²"]]}],"l":[]}},{"id":"F3-11","t":"松边拉应力","body":{"f":["\\sigma_2 = \\frac{F_2}{A}"],"d":[],"n":[],"c":["原文未给适用条件"],"s":["来源: 教材ch08"],"t":[{"head":["符号","含义","单位"],"rows":[["$\\sigma_2$","松边拉应力","MPa"],["$F_2$","松边拉力","N"],["$A$","传动带的横截面积","mm²"]]}],"l":[]}     while(p<T.length&&(T[p].t==='^'||T[p].t==='_')){
      const kind=T[p].t;p++;
      const a=atom();
      if(kind==='^')sup+=a;else sub+=a;
      has=true;
    }
    if(!has)return inner;
    if(sup.trim()==='<span class="mo">∘</span>')sup='°';
    return '<span class="ms">'+inner+(sub?'<span class="msub">'+sub+'</span>':'')+(sup?'<span class="msup">'+sup+'</span>':'')+'</span>';
  }
  function cmd(){
    const t=T[p];const n=t.v;p++;
    if(Object.prototype.hasOwnProperty.call(GREEK,n))return '<span class="mg">'+GREEK[n]+'</span>';
    if(Object.prototype.hasOwnProperty.call(OPS,n))return '<span class="mo">'+OPS[n]+'</span>';
    if(Object.prototype.hasOwnProperty.call(FUNCS,n))return '<span class="mf">'+FUNCS[n]+'</span>';
    if(Object.prototype.hasOwnProperty.call(BIGOPS,n))return '<span class="mbig">'+BIGOPS[n]+'</span>';

      }
      case 'sqrt':{
        let idx='';
        while(p<T.length&&T[p].t==='s')p++;
        if(T[p]&&T[p].t==='c'&&T[p].v==='['){
          p++;let d=1,buf='';
          while(p<T.length&&d>0){
            if(T[p].t==='c'&&T[p].v==='[')d++;
            if(T[p].t==='c'&&T[p].v===']'){d--;if(d===0){p++;break;}}
            if(T[p].t==='c')buf+=T[p].v;else if(T[p].t==='k')buf+='\\'+T[p].v;else if(T[p].t==='{')buf+='{';else if(T[p].t==='}')buf+='}';
            p++;
          }
          idx=buf;
        }
        const a=atom();
        return '<span class="msqrt">'+(idx?'<span class="mroot">'+renderLatex(idx)+'</span>':'')+'<span class="mradic">'+a+'</span></span>';
      }
      case 'text':case 'mbox':case 'textrm':case 'textnormal':case 'mathrm':case 'mathit':case 'mathbf':case 'operatorname':{
        const a=atom();return '<span class="mtext">'+a+'</span>';
      }
      case 'overline':case 'underline':{
        const a=atom();
        return '<span class="mover">'+a+'</span>';
      }
      case 'overbrace':case 'underbrace':{const a=atom();return a;}
      case 'left':case 'right':case 'big':case 'Big':case 'bigg':case 'Bigg':case 'bigl':case 'bigr':case 'bigm':case 'Bigl':case 'Bigr':case 'Bigm':{
        while(p<T.length&&T[p].t==='s')p++;
        if(T[p]&&(T[p].t==='c'||T[p].t==='k'))p++;
        return '';
      }
      case 'quad':return '<span class="msp"></span>';
      case 'qquad':return '<span class="msp msp-wide"></span>';
      case 'displaystyle':case 'textstyle':case 'limits':case 'nolimits':case 'relax':case 'allowbreak':return '';
      case ',':case ';':case '!':case ' ':return '<span class="msp"></span>';
      case 'begin':{
        const env=atom();
        if(ENVS.indexOf(env)>=0){
          if(T[p]&&T[p].t==='{'){let d=0;while(p<T.length){if(T[p].t==='{')d++;if(T[p].t==='}'){d--;if(d===0){p++;break;}}p++;}}
          let curCell='',curRow=[],rows=[];
          while(p<T.length){
            while(p<T.length&&T[p].t==='s')p++;
            if(p>=T.length)break;
            const q=T[p];
            if(q.t==='k'&&q.v==='end'){
              p++;curRow.push(curCell);rows.push(curRow);
              if(T[p]&&T[p].t==='{'){let d=0;while(p<T.length){if(T[p].t==='{')d++;if(T[p].t==='}'){d--;if(d===0){p++;break;}}p++;}}
              break;
            }
            if(q.t==='&'){p++;curRow.push(curCell);curCell='';continue;}
            if(q.t==='nl'){p++;curRow.push(curCell);rows.push(curRow);curCell='';curRow=[];continue;}
            curCell+=atom();
          }
          rows=rows.filter(r=>r.length&&r.some(c=>c!==''));
          if(!rows.length)return '';
          if(env==='cases'||env==='dcases'||env==='rcases'){
            return '<span class="mcases"><span class="mbrace">{</span><span class="mbody">'+
              rows.map(function(r){return '<span class="mrow">'+r.map(function(c){return '<span class="mtd">'+c+'</span>';}).join('')+'</span>';}).join('')+
              '</span></span>';
          }
          return '<span class="mtable">'+rows.map(r=>'<span class="mrow">'+r.map(c=>'<span class="mtd">'+c+'</span>').join('')+'</span>').join('')+'</span>';
        }
        return '';
      }
      case 'end':{
        if(T[p]&&T[p].t==='{'){let d=0;while(p<T.length){if(T[p].t==='{')d++;if(T[p].t==='}'){d--;if(d===0){p++;break;}}p++;}}
        return '';
      }
      case 'prime':return '<span class="mo">′</span>';
      case 'not':return '<span class="mo"≯</span>';
      default:return '<span class="munk" title="\\'+n+'">\\'+n+'</span>';
    }
  }
  function seq(inGroup){
    let out='';
    while(p<T.length){
      const t=T[p];
      if(inGroup&&t.t==='}')break;
      if(!inGroup&&t.t==='}'){p++;continue;}
      if(t.t==='&'||t.t==='nl'){p++;out+=' ';continue;}
      const start=p;
      let inner=atom();
      if(p===start)inner='';
      inner=scripts(inner);
      out+=inner;
    }
    return out;
  }
  try{return seq(false);}catch(e){return '<span class="munk">'+esc(src)+'</span>';}
}

/* ============================================================ 工具 */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mdInline(s){
  let out='',i=0;const n=s.length;
  while(i<n){
    const c=s[i];
    if(c==='`'){
      const j=s.indexOf('`',i+1);
      if(j>i){const code=s.slice(i+1,j);out+='<code class="'+((/\\|_|\^/.test(code))?'cm':'cd')+'">'+esc(code)+'</code>';i=j+1;continue;}
    }
    if(s.substr(i,2)==='**'){
      const j=s.indexOf('**',i+2);
      if(j>i){out+='<strong>'+mdInline(s.slice(i+2,j))+'</strong>';i=j+2;continue;}
    }
    if(c==='['&&s.substr(i,3)==='[待'){
      const j=s.indexOf(']',i);
      if(j>i){out+='<span class="tbd">'+esc(s.slice(i,j+1))+'</span>';i=j+1;continue;}
    }
    if(c==='['){
      const j=s.indexOf(']',i);
      if(j>i&&s[j+1]==='('){const k=s.indexOf(')',j);if(k>j){out+='<a href="'+esc(s.slice(j+2,k))+'" target="_blank" rel="noopener">'+mdInline(s.slice(i+1,j))+'</a>';i=k+1;continue;}}
    }
    out+=esc(c);i++;
  }
  return out;
}
/* 把 HTML 片段里的 $...$ 与 code.cm 变成渲染后的数学 */
function mathify(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(nd){return nd.nodeValue.indexOf('$')>=0?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(function(node){
    const txt=node.nodeValue;const parts=[];let last=0,i=0,hit=false;
    while(i<txt.length){
      if(txt[i]==='$'&&txt[i-1]!=='\\'){
        let j=i+1;while(j<txt.length&&txt[j]!=='$')j++;
        if(j<txt.length){parts.push({m:0,v:txt.slice(last,i)});parts.push({m:1,v:txt.slice(i+1,j)});last=j+1;i=j+1;hit=true;continue;}
      }
      i++;
    }
    if(!hit)return;
    parts.push({m:0,v:txt.slice(last)});
    const frag=document.createDocumentFragment();
    parts.forEach(function(p){
      if(p.m){const sp=document.createElement('span');sp.className='math';sp.innerHTML=renderLatex(p.v);frag.appendChild(sp);}
      else frag.appendChild(document.createTextNode(p.v));
    });
    node.parentNode.replaceChild(frag,node);
  });
  root.querySelectorAll('code.cm').forEach(function(el){
    const sp=document.createElement('span');sp.className='math';sp.innerHTML=renderLatex(el.textContent);
    el.parentNode.replaceChild(sp,el);
  });
}

function tableHTML(t){
  let h='<div class="tw"><table>';
  if(t.head&&t.head.some(function(c){return c&&c.trim();})){
    h+='<thead><tr>'+t.head.map(function(c){return '<th>'+mdInline(c||'')+'</th>';}).join('')+'</tr></thead>';
  }
  h+='<tbody>'+t.rows.map(function(r){
    return '<tr>'+r.map(function(c){return '<td>'+mdInline(c||'')+'</td>';}).join('')+'</tr>';
  }).join('')+'</tbody></table></div>';
  return h;
}

/* 把 LaTeX 片段转成可搜索的纯文本：\sigma_H -> σH，d_1 -> d1 */
function latexToPlain(s){
  if(s==null)return '';
  let out;
  if(typeof s==='object'){try{out=JSON.stringify(s);}catch(e){out='';}}
  else out=String(s);
  out=out.replace(/\$/g,'');
  out=out.replace(/\\([a-zA-Z]+)/g,function(m,n){
    if(window.__GREEK&&window.__GREEK[n])return window.__GREEK[n];
    if(window.__OPS&&window.__OPS[n])return window.__OPS[n];
    if(window.__FUNCS&&window.__FUNCS[n])return window.__FUNCS[n];
    return '';
  });
  out=out.replace(/[{}]/g,'').replace(/_/g,'').replace(/\^/g,'');
  return out;
}
function cardHTML(card){
  const b=card.body;
  const hasF=b.f&&b.f.length;
  const typo=(b.n||[]).some(function(x){return /原文如此/.test(x);});
  const tbd=JSON.stringify(b).indexOf('[待核对]')>=0;
  const diff=/差异/.test(JSON.stringify(b))||(b.s||[]).length>1;
  const searchRaw=(card.id+' '+card.t+' '+(b.d||[]).join(' ')+' '+(b.c||[]).join(' ')+' '+(b.s||[]).join(' ')+' '+JSON.stringify(b.t||[])+' '+JSON.stringify(b.l||[]));
  const searchPlain=(card.id+' '+card.t+' '+(b.t||[]).map(latexToPlain).join(' ')+' '+(b.l||[]).map(latexToPlain).join(' ')+' '+(b.d||[]).map(latexToPlain).join(' ')+' '+(b.c||[]).join(' '));
  let h='<article class="card" data-id="'+esc(card.id)+'" data-search="'+esc((searchRaw+' '+searchPlain).toLowerCase().replace(/"/g,''))+'" data-flag="'+(typo?'1':'0')+(tbd?'1':'0')+(diff?'1':'0')+'">';
  h+='<div class="card-h">';
  if(card.id)h+='<span class="fid">'+esc(card.id)+'</span>';
  h+='<span class="fname">'+esc(card.t||'')+'</span>';
  h+='<span class="badges">';
  if(tbd)h+='<span class="badge b-tbd">待核对</span>';
  if(typo)h+='<span class="badge b-typo">原文如此·疑笔误</span>';
  if(diff)h+='<span class="badge b-diff">多源差异</span>';
  (b.s||[]).forEach(function(s){
    String(s).split(/\][ ]*\[/).map(function(x){
      return x.replace(/^\[/,'').replace(/\]$/,'').replace(/^来源[:：]\s*/,'').trim();
    }).filter(function(x){return x;}).forEach(function(x){
      h+='<span class="badge b-src">'+esc(x)+'</span>';
    });
  });
  h+='</span></div>';
  (b.d||[]).forEach(function(d){h+='<div class="desc">'+mdInline(d)+'</div>';});
  if(hasF){
    h+='<div class="fx">'+b.f.map(function(f){return '<span class="math">'+renderLatex(f)+'</span>';}).join('')+'</div>';
  }
  (b.t||[]).forEach(function(t){h+=tableHTML(t);});
  if((b.c||[]).length){h+='<ul class="conds">'+b.c.map(function(c){return '<li>'+mdInline(c)+'</li>';}).join('')+'</ul>';}
  if((b.l||[]).length){
    h+='<ul class="kv">'+b.l.map(function(it){
      return '<li>'+(it.k?'<b>'+mdInline(it.k)+'：</b>':'')+mdInline(it.v)+'</li>';
    }).join('')+'</ul>';
  }
  (b.n||[]).forEach(function(x){h+='<div class="note"><span class="lb">注</span>'+mdInline(x)+'</div>';});
  h+=calcHTML(card);
  h+='</article>';
  return h;
}

      html+='<section class="sec" id="'+sa+'"><div class="sec-h"><span class="n">'+esc(s.id)+'</span>'+
        (nf?'<span class="c">'+nf+' 条</span>':'')+'</div>';
      toc+='<a class="lv2" href="#'+sa+'">'+esc(s.id)+' <span class="cnt">'+nf+'</span></a>';
      s.cards.forEach(function(c,ci){
        html+=cardHTML(c);
        toc+='<a class="lv3" href="#'+sa+'-c'+ci+'" data-t="'+esc(sa+' '+c.id+' '+c.t)+'">'+esc(c.id||('#'+(ci+1)))+' '+(c.t?esc(c.t):'')+'</a>';
      });
      html+='</section>';
    });
    html+='</section>';
  });

  html+='<footer id="sources"><h3>公式来源与核对说明</h3>'+
    '<p>本手册公式按来源文件<strong>逐字照录</strong>，未修正符号、系数、指数、上下标、括号、正负号与运算顺序；方括号 <code class="cd">[ ]</code> 表示许用值。原文已注明的笔误一律照录并标注「原文如此·疑笔误」。凡来源未给出的公式、数值、符号定义一律不补写，标 <span class="tbd">[待核对]</span>。</p>'+
    '<p><strong>主干来源</strong>：濮良贵《机械设计》（第9版）教材知识点整理 domm.muzing.top（ch02~ch15 共 13 章，公式依据 GB/T 3480-1997、GB/T 13575.1 等国家标准）。</p>'+
    '<p><strong>外部核对来源（10 份）</strong>：</p><ol>'+
    '<li>Mechtool 齿轮承载能力计算工具（GB/T 3480-1997）</li>'+
    '<li>Mechtool V 带传动计算工具（GB/T 13575.1）</li>'+
    '<li>ME311 机械设计第三章齿轮传动习题课 PDF（南方科技大学）</li>'+
    '<li>speedreducer.org《机械设计基础》网络课程 Chapter 11（螺栓/键）</li>'+
    '<li>speedreducer.org《机械设计基础》网络课程 Chapter 07（轴）</li>'+
    '<li>中文维基百科「带 (机械)」rev 95077185</li>'+
    '<li>中文维基百科「轴承」rev 93685128</li>'+
    '<li>中文维基百科「蝸桿傳動」rev 82127380</li>'+
    '<li>中文维基百科「滚子链」rev 96238216</li>'+
    '<li>GB/T 1243（滚子链）等标准条款（经上述来源转引）</li>'+
    '</ol>'+
    '<p style="margin-top:8px">维基百科仅「带传动」2 式可供核对；滚动轴承 <code class="cd">ε=3</code> 由其算例 <code class="cd">10⁶×(1000/500)³=8×10⁶</code> 反推旁证；滚子链与蜗杆页面无公式可核对。</p>'+
    '</footer>';

  const content=document.getElementById('content');
  content.innerHTML=html;
  document.getElementById('toc').innerHTML=toc;
  mathify(content);
  content.querySelectorAll('article.card').forEach(function(el,i){el.id=el.closest('.sec').id+'-c'+i;});
  bindCalcs(content);
  buildChips();
  applyFilter();
}

/* ---------------- 筛选 / 搜索 ---------------- */
let state={q:'',part:'all',diffOnly:false};
function buildChips(){
  const box=document.getElementById('chips');
  let h='<button class="chip" data-part="all" aria-pressed="true">全部</button>';
  DATA.parts.forEach(function(p,i){
    let lab=p.title.replace(/^#\s*/,'');
    lab=lab.replace(/^[一二三四五六七八九十]+、/,'');
    if(lab.length>10)lab=lab.slice(0,10)+'…';
    h+='<button class="chip" data-part="p'+i+'" aria-pressed="false">'+esc(lab)+'</button>';
  });
  box.innerHTML=h;
  box.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click',function(){
      state.part=b.dataset.part;
      box.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
      applyFilter();
    });
  });
}
/* 检索归一化：忽略下标线、括号、反斜杠、$ 等排版符号，让 σ_b / σb / [σ] / σ 都能命中 */
function normQ(s){
  return String(s==null?'':s).toLowerCase().replace(/[\s_\[\](){}^\\$,.;:!?'"]/g,'');
}
function applyFilter(){
  const q=normQ(state.q);
  const parts=document.querySelectorAll('#content .part');
  let shown=0;
  parts.forEach(function(ps,pi){
    const okPart=state.part==='all'||state.part==='p'+pi;
    let vis=0;
    ps.querySelectorAll('article.card').forEach(function(c){
      let ok=okPart;
      if(ok&&q){
        ok=normQ(c.dataset.search||'').indexOf(q)>=0||normQ(c.querySelector('.fname')?c.querySelector('.fname').textContent:'').indexOf(q)>=0;
      }
      if(ok&&state.diffOnly){ok=c.dataset.flag.indexOf('1')>=0;}
      c.classList.toggle('hide',!ok);
      if(ok)vis++;
    });
    ps.querySelectorAll('.sec').forEach(function(s){
      const any=s.querySelector('article.card:not(.hide)');
      s.classList.toggle('hide',!any);
      s.style.display=any?'':'none';
    });
    ps.classList.toggle('hide',vis===0);
    ps.style.display=vis===0?'none':'';
    shown+=vis;
  });
  document.getElementById('toc').querySelectorAll('a.lv3').forEach(function(a){
    const id=a.getAttribute('href').slice(1);
    const el=document.getElementById(id);
    if(!el)return;
    const vis=!el.classList.contains('hide');
    a.style.display=vis?'':'none';
    if(q&&vis)a.classList.add('hl');else a.classList.remove('hl');
  });
  document.getElementById('toc').querySelectorAll('a.lv1,a.lv2').forEach(function(a){
    const id=a.getAttribute('href').slice(1);
    const el=document.getElementById(id);
    if(!el)return;
    a.style.display=el.style.display==='none'?'none':'';
  });
  let e=document.getElementById('noRes');
  if(shown===0){
    if(!e){e=document.createElement('div');e.id='noRes';e.className='empty';e.textContent='没有匹配的公式，请换个关键词。';document.getElementById('content').appendChild(e);}
  }else if(e){e.remove();}
}

/* ---------------- 交互 ---------------- */
document.getElementById('q').addEventListener('input',function(e){state.q=e.target.value;applyFilter();});
document.getElementById('diffBtn').addEventListener('click',function(){
  state.diffOnly=!state.diffOnly;
  this.setAttribute('aria-pressed',String(state.diffOnly));
  this.textContent=state.diffOnly?'显示全部':'仅看差异/存疑';
  applyFilter();
});
document.getElementById('printBtn').addEventListener('click',function(){window.print();});
document.getElementById('themeBtn').addEventListener('click',function(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('mech-theme',next);}catch(e){}
});
(function(){
  let t=null;try{t=localStorage.getItem('mech-theme');}catch(e){}
  if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
})();
document.getElementById('menuBtn').addEventListener('click',function(){
  document.getElementById('toc').classList.toggle('open');
});
document.getElementById('toc').addEventListener('click',function(e){
  if(e.target.tagName==='A'&&window.innerWidth<=900)this.classList.remove('open');
});
document.getElementById('openAllBtn').addEventListener('click',function(){
  const hidden=document.querySelectorAll('#content article.card.hide').length;
  if(hidden){state.q='';state.part='all';state.diffOnly=false;document.getElementById('q').value='';applyFilter();
    document.querySelectorAll('#chips .chip').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.part==='all'));});
    this.textContent='收起差异项';}
  else{state.diffOnly=true;this.textContent='显示全部';applyFilter();}
});
/* 目录高亮 */
window.addEventListener('scroll',function(){
  const secs=document.querySelectorAll('#content .sec');
  let cur=null;
  secs.forEach(function(s){if(s.getBoundingClientRect().top<120)cur=s;});
  document.querySelectorAll('#toc a.cur').forEach(function(a){a.classList.remove('cur');});
  if(cur){
    const a=document.querySelector('#toc a[href="#'+cur.id+'"]');
    if(a)a.classList.add('cur');
  }
},{passive:true});

render();
</script>
